queue_rules:
  - name: bl-default
    conditions:
      - base=main
      - -conflict
pull_request_rules:
  - name: bl-act1-automerge
    conditions:
      - base=main
      - head=bl-act1
      - -conflict
    actions:
      merge:
        method: merge
      label:
        add:
          - bl-lane-hit
      comment:
        message: BL-lane 125642 runtime proof — merged by engine automation, no human action.
  - name: bl-act3-queue
    conditions:
      - base=main
      - head=bl-act2-1
      - -conflict
    actions:
      queue:
        name: bl-default
  - name: race-q-1838
    conditions:
      - base=main
      - label=never-applied-race-q
    actions:
      label:
        add:
          - race-q
